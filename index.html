<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pigeon Domains</title>
  <meta name="description" content="A small personal collection of Pigeon web projects and domains.">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0d;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: 90%;
      max-width: 560px;
      text-align: center;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 42px;
    }
    .subtitle {
      color: #999;
      margin-bottom: 35px;
    }
    .domains {
      display: grid;
      gap: 12px;
    }
    .domain {
      display: block;
      padding: 18px;
      border: 1px solid #292929;
      border-radius: 12px;
      background: #121214;
      color: #fff;
      text-decoration: none;
      transition: 0.2s;
    }
    .domain:hover {
      background: #19191c;
      border-color: #555;
      transform: translateY(-2px);
    }
    .pending {
      padding: 18px;
      border: 1px dashed #333;
      border-radius: 12px;
      color: #777;
    }
    footer {
      margin-top: 35px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <h1>🐦 Pigeon Domains</h1>
    <p class="subtitle">
      A collection of my personal web projects.
    </p>
    <div class="domains">
      <a class="domain"
         href="https://pigeonlol.web.app/"
         rel="noopener noreferrer">
        pigeonlol.web.app
      </a>
      <a class="domain"
         href="https://pigeonn.pages.dev/"
         rel="noopener noreferrer">
        pigeonn.pages.dev
      </a>
      <a class="domain"
         href="https://pigeonfun.vercel.app/"
         rel="noopener noreferrer">
        pigeonfun.vercel.app
      </a>
      <div class="pending">
        pigeon.is-a.bot — pending approval
      </div>
    </div>
    <footer>
      Personal, non-commercial website.
    </footer>
  </main>
</body>
</html>
